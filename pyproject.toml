[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "unitconverter"
version = "0.1.0"
dependencies = [
    "requests"
]
authors = [
    { name="Ange-T", email="angetossou.dev@gmail.com" }
]
description = "Convert values between units of measurement, from the command line or a graphical interface."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities"
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Changelog = "https://github.com/Ange-TOSSOU/Unit_Converter_in_Python/blob/main/CHANGELOG.md"
Repository = "https://github.com/Ange-TOSSOU/Unit_Converter_in_Python"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Uncomment in Step 6, once the CLI module exists:
# [project.scripts] 
# unitconverter = "unitconverter.cli:main"
# [project.gui-scripts] # Windows 
# unitconverter = "unitconverter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# addopts = "--cov=unitconverter --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
